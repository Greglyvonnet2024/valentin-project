<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pour toi 💖</title>

  <!-- Police manuscrite romantique -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- INTRO ENVELOPPE -->
  <div id="intro" class="intro">
    <div class="envelope" id="openEnvelope" role="button" tabindex="0" aria-label="Ouvrir l’enveloppe">
      <div class="env-back">
        <div class="recipient">Pour Anaïs</div>
      </div>

      <div class="env-flap"></div>
      <div class="seal" aria-hidden="true">❤</div>
    </div>
  </div>

  <!-- PAGE PRINCIPALE -->
  <div id="app" class="app hidden">
    <div id="petals" aria-hidden="true"></div>

    <div class="content" id="contentBox">
      <h1 id="questionTitle">Voulez-vous être ma Valentine ?</h1>

      <div class="buttons" id="buttonsRow">
        <button id="yesBtn" class="btn yes" type="button">Oui</button>
        <button id="noBtn" class="btn no" type="button">Non</button>
      </div>

      <!-- SUCCESS -->
      <div id="success" class="success hidden">
        <div class="successTitle">Félicitations ✨</div>
        <div class="successSub">Votre amoureux est en route pour vous couvrir d'amour et de baisers🎁💘</div>
      </div>
    </div>

    <!-- OVERLAY IMAGE + TEXTE -->
    <div id="warningOverlay" class="overlay hidden" aria-hidden="true">
      <div class="overlayCard">
        <img src="assets/img/chatonfusil.png" alt="Chat" />
        <p class="overlayText">Tu es sûr de toi ? 😼</p>
      </div>
    </div>
  </div>

  <!-- MUSIQUE (ajoute ton mp3 ici) -->
  <audio id="bgMusic" loop>
    <source src="assets/audio/musique.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
